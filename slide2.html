<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Slide Engine</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

<style>

/* ======================================================
   RESET
====================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Segoe UI,sans-serif;
  background:
  linear-gradient(135deg,#020617,#0f172a);
  color:#fff;
  overflow:hidden;
}

/* ======================================================
   HOME
====================================================== */

#home{
  width:100%;
  height:100vh;
  overflow:auto;
  padding:40px;
}

.home-header{
  margin-bottom:40px;
}

.home-header h1{
  font-size:48px;
  margin-bottom:10px;
}

.home-header p{
  color:#94a3b8;
  font-size:18px;
}

.gist-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px;
}

.gist-card{
  background:rgba(15,23,42,.7);
  border:1px solid #1e293b;
  border-radius:20px;
  padding:24px;
  cursor:pointer;
  transition:.3s;
  position:relative;
  overflow:hidden;
}

.gist-card:hover{
  transform:translateY(-5px);
  border-color:#60a5fa;
  box-shadow:0 10px 40px rgba(96,165,250,.2);
}

.gist-card h2{
  margin-bottom:10px;
  font-size:24px;
}

.gist-card p{
  color:#94a3b8;
  line-height:1.6;
}

.gist-tag{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:20px;
  padding:8px 14px;
  border-radius:999px;
  background:#1e293b;
  font-size:14px;
}

.gist-bg{
  position:absolute;
  right:-40px;
  bottom:-40px;
  font-size:120px;
  opacity:.05;
}

/* ======================================================
   SLIDES
====================================================== */

#viewer{
  width:100%;
  height:100vh;
  display:none;
  position:relative;
}

#app{
  width:100%;
  height:100%;
  overflow:auto;
}

/* ======================================================
   NAV
====================================================== */

.nav-btn{
  position:fixed;
  top:0;
  width:80px;
  height:100vh;
  border:none;
  background:transparent;
  color:#fff;
  font-size:28px;
  cursor:pointer;
  z-index:999;
  transition:.3s;
}

.nav-btn:hover{
  background:rgba(255,255,255,.05);
}

.next{
  right:0;
}

.prev{
  left:0;
}

.home-btn{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  border:none;
  background:#111827;
  border:1px solid #334155;
  color:#fff;
  width:50px;
  height:50px;
  border-radius:14px;
  cursor:pointer;
  font-size:20px;
}

/* ======================================================
   SLIDE BASE
====================================================== */

.slide{
  min-height:100vh;
  padding:60px;
}

.header{
  margin-bottom:40px;
}

.header h1{
  font-size:54px;
  margin-bottom:10px;
}

.subtitle{
  font-size:22px;
  color:#94a3b8;
}

/* ======================================================
   CAPA
====================================================== */

.hero{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:40px;
  min-height:80vh;
}

.hero-content{
  flex:1;
}

.topline{
  color:#A020F0;
  font-size:22px;
  margin-bottom:20px;
}

.hero-title{
  font-size:80px;
  line-height:1;
  margin-bottom:20px;
}

.hero-subtitle{
  color:#94a3b8;
  font-size:28px;
  max-width:700px;
}

.hero-image{
  width:40%;
  border-radius:30px;
  border:1px solid #1e293b;
}

/* ======================================================
   FEATURES
====================================================== */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:rgba(15,23,42,.7);
  border:1px solid #1e293b;
  border-radius:20px;
  padding:24px;
}

.problem{
  border-left:5px solid #ef4444;
}

.solution{
  border-left:5px solid #22c55e;
}

.card h3{
  margin-bottom:20px;
  font-size:24px;
}

.card ul{
  list-style:none;
}

.card li{
  margin-bottom:14px;
  color:#cbd5e1;
  line-height:1.5;
}

/* ======================================================
   IMAGE
====================================================== */

.image-slide{
  padding:0;
  position:relative;
}

.full-image{
  width:100%;
  height:100vh;
  object-fit:cover;
}

.overlay{
  position:absolute;
  left:60px;
  bottom:60px;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(20px);
  padding:30px;
  border-radius:24px;
  max-width:700px;
}

.overlay h1{
  font-size:56px;
  margin-bottom:10px;
}

.overlay p{
  color:#cbd5e1;
  font-size:22px;
}

/* ======================================================
   ANIMAÇÃO
====================================================== */

.fade-in{
  animation:fade .6s ease;
}

@keyframes fade{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* ======================================================
   RESPONSIVO
====================================================== */

@media(max-width:900px){

  .hero{
    flex-direction:column;
  }

  .hero-image{
    width:100%;
  }

  .hero-title{
    font-size:52px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .overlay h1{
    font-size:38px;
  }

}

</style>
</head>

<body>

<!-- ======================================================
     HOME
====================================================== -->

<section id="home">

  <div class="home-header">
    <h1>Slide Engine</h1>
    <p>
      Apresentações dinâmicas via Markdown + Gists
    </p>
  </div>

  <div class="gist-grid" id="gist-grid"></div>

</section>

<!-- ======================================================
     VIEWER
====================================================== -->

<section id="viewer">

  <button class="home-btn" onclick="voltarHome()">
    <i class="fa-solid fa-house"></i>
  </button>

  <button class="nav-btn prev" onclick="slideAnterior()">
    <i class="fa-solid fa-chevron-left"></i>
  </button>

  <button class="nav-btn next" onclick="proximoSlide()">
    <i class="fa-solid fa-chevron-right"></i>
  </button>

  <div id="app"></div>

</section>

<script>

/* ======================================================
   GISTS CADASTRADOS
====================================================== */

const apresentacoes = [

  {
    titulo: "FlowPro",
    descricao: "Sistema SaaS para academias com IA.",
    categoria: "Fitness SaaS",
    icone: "fa-solid fa-dumbbell",
    gist: "5bda7dc9036c1d48ee9e820aac2b6735"
  },

  {
    titulo: "PetAI",
    descricao: "Plataforma veterinária inteligente.",
    categoria: "Pet Tech",
    icone: "fa-solid fa-paw",
    gist: "235bd5c9742f0a60d2cc3675ee18478d"
  },

  {
    titulo: "FinanceAI",
    descricao: "Dashboard financeiro automatizado.",
    categoria: "Fintech",
    icone: "fa-solid fa-chart-line",
    gist: "235bd5c9742f0a60d2cc3675ee18478d"
  }

];

/* ======================================================
   STATE
====================================================== */

let slides = [];
let slideAtual = 0;
let gist_id = null;

/* ======================================================
   HOME
====================================================== */

function renderHome(){

  const grid = document.getElementById("gist-grid");

  grid.innerHTML = "";

  apresentacoes.forEach(item => {

    const div = document.createElement("div");

    div.className = "gist-card fade-in";

    div.innerHTML = `
      <div class="gist-bg">
        <i class="${item.icone}"></i>
      </div>

      <h2>${item.titulo}</h2>

      <p>${item.descricao}</p>

      <div class="gist-tag">
        <i class="${item.icone}"></i>
        ${item.categoria}
      </div>
    `;

    div.onclick = () => abrirApresentacao(item.gist);

    grid.appendChild(div);

  });

}

/* ======================================================
   OPEN PRESENTATION
====================================================== */

async function abrirApresentacao(gist){

  gist_id = gist;

  document.getElementById("home").style.display = "none";
  document.getElementById("viewer").style.display = "block";

  const markdown = await carregarMarkdown();

  slides = parseSlides(markdown);

  slideAtual = 0;

  mostrarSlide(slides[slideAtual]);

}

/* ======================================================
   BACK HOME
====================================================== */

function voltarHome(){

  document.getElementById("viewer").style.display = "none";
  document.getElementById("home").style.display = "block";

}

/* ======================================================
   FETCH
====================================================== */

async function carregarMarkdown(){

  const response =
  await fetch(`https://api.github.com/gists/${gist_id}`);

  const data = await response.json();

  return Object.values(data.files)[0].content;

}

/* ======================================================
   PARSER
====================================================== */

function parseSlides(md){

  const blocos =
  md.split(/^#slide:/gm).filter(Boolean);

  return blocos.map(bloco => {

    const linhas =
    bloco.trim().split("\n");

    const tipo =
    linhas.shift().trim();

    const slide = { tipo };

    let chaveAtual = null;

    linhas.forEach(linha => {

      if(!linha.trim()) return;

      if(linha.includes(":")){

        const [key,...rest] =
        linha.split(":");

        chaveAtual = key.trim();

        const valor =
        rest.join(":").trim();

        if(valor){

          slide[chaveAtual] = valor;

        }else{

          slide[chaveAtual] = [];

        }

      }

      else if(linha.startsWith("- ")){

        if(!Array.isArray(slide[chaveAtual])){

          slide[chaveAtual] = [];

        }

        slide[chaveAtual].push(
          linha.replace("- ","")
        );

      }

    });

    return slide;

  });

}

/* ======================================================
   LAYOUTS
====================================================== */

const layouts = {

  capa: renderCapa,
  features: renderFeatures,
  imagem: renderImagem

};

/* ======================================================
   CAPA
====================================================== */

function renderCapa(slide){

  return `
  <section class="slide fade-in">

    <div class="hero">

      <div class="hero-content">

        <p class="topline">
          ${slide.topline || ""}
        </p>

        <h1 class="hero-title">
          ${slide.titulo || ""}
        </h1>

        <p class="hero-subtitle">
          ${slide.subtitulo || ""}
        </p>

      </div>

      ${
        slide.imagem
        ? `<img src="${slide.imagem}" class="hero-image">`
        : ""
      }

    </div>

  </section>
  `;

}

/* ======================================================
   FEATURES
====================================================== */

function renderFeatures(slide){

  return `
  <section class="slide fade-in">

    <div class="header">

      <h1>${slide.titulo || ""}</h1>

      <p class="subtitle">
        ${slide.subtitulo || ""}
      </p>

    </div>

    <div class="grid">

      <div class="card problem">

        <h3>❌ Problemas</h3>

        <ul>

          ${(slide.problema || [])
            .map(i => `<li>${i}</li>`)
            .join("")}

        </ul>

      </div>

      <div class="card solution">

        <h3>✅ Soluções</h3>

        <ul>

          ${(slide.solucao || [])
            .map(i => `<li>${i}</li>`)
            .join("")}

        </ul>

      </div>

    </div>

  </section>
  `;

}

/* ======================================================
   IMAGE
====================================================== */

function renderImagem(slide){

  return `
  <section class="slide image-slide fade-in">

    <img
      src="${slide.imagem}"
      class="full-image"
    >

    <div class="overlay">

      <h1>${slide.titulo || ""}</h1>

      <p>${slide.subtitulo || ""}</p>

    </div>

  </section>
  `;

}

/* ======================================================
   SHOW
====================================================== */

function mostrarSlide(slide){

  const app =
  document.getElementById("app");

  if(!layouts[slide.tipo]){

    app.innerHTML = `
      <div style="padding:40px">
        Layout "${slide.tipo}" não existe.
      </div>
    `;

    return;

  }

  app.innerHTML =
  layouts[slide.tipo](slide);

}

/* ======================================================
   NAVIGATION
====================================================== */

function proximoSlide(){

  slideAtual++;

  if(slideAtual >= slides.length){

    slideAtual = 0;

  }

  mostrarSlide(slides[slideAtual]);

}

function slideAnterior(){

  slideAtual--;

  if(slideAtual < 0){

    slideAtual = slides.length - 1;

  }

  mostrarSlide(slides[slideAtual]);

}

/* ======================================================
   KEYBOARD
====================================================== */

document.addEventListener("keydown", e => {

  if(
    document.getElementById("viewer").style.display
    !== "block"
  ) return;

  if(e.key === "ArrowRight"){

    proximoSlide();

  }

  if(e.key === "ArrowLeft"){

    slideAnterior();

  }

  if(e.key === "Escape"){

    voltarHome();

  }

});

/* ======================================================
   INIT
====================================================== */

renderHome();

</script>

</body>
</html>
